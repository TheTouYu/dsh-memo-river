[package]
name = "memo-kernel"
version = "0.1.0"
edition = "2021"

# vexus-lite 内核复刻（dsh-memo-river 子项目）
# 依赖集与上游 ~/app/VCPToolBox/rust-vexus-lite/Cargo.toml 对齐——
# 同版本依赖（尤其 rusqlite bundled 的 sqlite 与 nalgebra）是差分数值可比的前提，勿随手升级。

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["napi4"] }
napi-derive = "2.16"

tokio = { version = "1", features = ["full"] }

bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
sha2 = "0.10"
flate2 = "1.0"

usearch = "2.8"

hashbrown = "0.14"

rayon = "1.10"

nalgebra = "0.32"

rusqlite = { version = "0.29", features = ["bundled"] }

notify = "6.1"

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
